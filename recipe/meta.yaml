{% set name = "spectrally" %}
{% set version = "0.0.10" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/spectrally-{{ version }}.tar.gz
  sha256: bc2c03be6d6d0e866a904b9c56d2b73c6acad152f45d979cad5f3b3272220b8b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - spectrally-version = spectrally.scripts.spectrallyversion:main
    - specrally-custom=spectrally.scripts.spectrallycustom:main
    - spectrally = spectrally.scripts.spectrally_bash:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.8.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy <2.0
    - scipy
    - matplotlib-base
    - pandas
    - requests
    - bsplines2d >=0.0.19

test:
  imports:
    - spectrally
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ToFuProject/spectrally
  summary: A python library for generic spectrum fitting, using datastock
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Didou09
